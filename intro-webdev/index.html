<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello WOrld!</h1>
    <button class="event-listener">Click me now!</button>

        <button id="theme-toggle">Switch to Dark Mode</button>

<ol class="layout">
        <ul class="upper-1">
            <li class="screen">0</li>
        </ul>

        <ul class="upper-2">
            <li class="grid-item-1">
                <button></button>
            </li>
            <li><button>←</button></li>
            <li><button>÷</button></li>
        </ul>

        <ul class="upper-3">
            <li><button>7</button></li>
            <li><button>8</button></li>
            <li><button>9</button></li>
            <li><button>×</button></li>
        </ul>

        <ul class="lower-4">
            <li><button>4</button></li>
            <li><button>5</button></li>
            <li><button>6</button></li>
            <li><button>-</button></li>
        </ul>

        <ul class="lower-5">
            <li><button>1</button></li>
            <li><button>2</button></li>
            <li><button>3</button></li>
            <li><button>+</button></li>
        </ul>

        <ul class="lower-6">
            <li><button>0</button></li>
            <li><button>=</button></li>
        </ul>
</ol>
<br>

<pre>
  <code id="code-block"></code>
</pre>

<div class='box-ex'></div>

<input type="text" placeholder="enter color" id="textbox"/>
 
<script src="script.js"></script>
</body>
</html>
